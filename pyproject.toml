[project]
name = "eutopos-vps"
version = "0.0.0"
description = "Visual Positioning System lokal untuk navigasi dalam gedung"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependensi runtime torch dan hloc belum dideklarasikan di sini (varian CPU atau CUDA dan commit
# hloc dipasang manual, docs/spike-plan.md bagian 12). FastAPI untuk server/ sudah dideklarasikan.
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
# Alat yang dipakai CI dan pengembang lokal. Versi persisnya dikunci di uv.lock.
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "zizmor>=1.30.1",
]

[tool.uv]
package = false
# Versi uv dipin di sini. setup-uv di CI membaca nilai ini, dan uv lokal menolak berjalan kalau
# versinya berbeda. Perbarui dengan sengaja: ubah nilai ini, lalu `uv self update <versi>`.
required-version = "==0.12.19"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]  # skill pihak ketiga, disalin apa adanya dari sumbernya

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # urutan import
    "B",   # bugbear
    "UP",  # sintaks Python modern
    "RUF", # aturan khusus ruff
]

[tool.fastapi]
entrypoint = "server.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
