# Layanan eutopos: PostgreSQL + API. Jalankan dari folder deploy/:
#   cp .env.example .env   (lalu isi POSTGRES_PASSWORD)
#   docker compose up -d --build
# Varian GPU: docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# Panduan lengkap: deploy/README.md

name: eutopos

services:
  db:
    image: postgres:17-bookworm  # versi mayor dipin, perbaikan keamanan minor ikut saat pull
    environment:
      POSTGRES_DB: eutopos
      POSTGRES_USER: eutopos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eutopos -d eutopos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Sengaja tanpa "ports": database hanya bisa dijangkau dari jaringan internal compose.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eutopos:${POSTGRES_PASSWORD}@db:5432/eutopos
      EUTOPOS_AREA: ${EUTOPOS_AREA:-demo}
      EUTOPOS_DEVICE: cpu
      EUTOPOS_THREADS: ${EUTOPOS_THREADS:-0}
      EUTOPOS_GLOBAL_RESIZE: ${EUTOPOS_GLOBAL_RESIZE:-512}
    volumes:
      # Bind panjang dengan create_host_path: false: kalau EUTOPOS_MAPS_DIR salah, compose menolak
      # menyala. Bentuk pendek diam-diam membuat folder kosong, dan layanan gagal memuat peta.
      - type: bind
        source: ${EUTOPOS_MAPS_DIR:?isi EUTOPOS_MAPS_DIR di deploy/.env}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
      - cache:/cache
    ports:
      - "${EUTOPOS_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  cache:
