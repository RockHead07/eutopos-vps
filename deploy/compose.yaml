# Layanan eutopos: PostgreSQL + API + pekerja bangun peta. Jalankan dari folder deploy/:
#   cp .env.example .env   (lalu isi POSTGRES_PASSWORD)
#   docker compose up -d --build
# Varian GPU: docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# Panduan lengkap: deploy/README.md

name: eutopos

services:
  db:
    image: postgres:17-bookworm  # versi mayor dipin, perbaikan keamanan minor ikut saat pull
    environment:
      POSTGRES_DB: eutopos
      POSTGRES_USER: eutopos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eutopos -d eutopos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Sengaja tanpa "ports": database hanya bisa dijangkau dari jaringan internal compose.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eutopos:${POSTGRES_PASSWORD}@db:5432/eutopos
      EUTOPOS_AREA: ${EUTOPOS_AREA:-demo}
      EUTOPOS_DEVICE: cpu
      EUTOPOS_THREADS: ${EUTOPOS_THREADS:-0}
      EUTOPOS_GLOBAL_RESIZE: ${EUTOPOS_GLOBAL_RESIZE:-512}
      # Autentikasi /api/* dan unggahan (server/auth.py). Kosong = 503, gagal tertutup.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      EUTOPOS_DEV_NO_AUTH: ${EUTOPOS_DEV_NO_AUTH:-0}
      # Rahasia kanal hook tusd -> api. Kosong = hook ditutup (503).
      TUS_HOOK_SECRET: ${TUS_HOOK_SECRET:-}
    volumes:
      # Bind panjang dengan create_host_path: false: kalau EUTOPOS_MAPS_DIR salah, compose menolak
      # menyala. Bentuk pendek diam-diam membuat folder kosong, dan layanan gagal memuat peta.
      - type: bind
        source: ${EUTOPOS_MAPS_DIR:?isi EUTOPOS_MAPS_DIR di deploy/.env}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
      # Hanya folder unggahan, baca tulis: hook membuang sisa unggahan lama dan memeriksa ukuran.
      - type: bind
        source: ${EUTOPOS_DATA_DIR:?isi EUTOPOS_DATA_DIR di deploy/.env}/uploads
        target: /data/uploads
        bind:
          create_host_path: false
      - cache:/cache
    ports:
      - "${EUTOPOS_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "server.worker"]
    init: true  # SIGTERM diteruskan, compose stop tidak menunggu 10 s lalu SIGKILL
    # DataLoader PyTorch (dipakai hloc) mengirim data antarproses lewat /dev/shm. Bawaan Docker
    # 64 MB habis dengan foto 2560x1440: "unable to allocate shared memory" (PC lab, 2026-10-01).
    shm_size: "2gb"
    environment:
      DATABASE_URL: postgresql+psycopg://eutopos:${POSTGRES_PASSWORD}@db:5432/eutopos
    volumes:
      # Pekerja menulis peta baru, jadi /maps baca tulis (api tetap baca saja).
      - type: bind
        source: ${EUTOPOS_MAPS_DIR:?isi EUTOPOS_MAPS_DIR di deploy/.env}
        target: /maps
        bind:
          create_host_path: false
      - type: bind
        source: ${EUTOPOS_DATA_DIR:?isi EUTOPOS_DATA_DIR di deploy/.env}
        target: /data
        bind:
          create_host_path: false
      - cache:/cache
    healthcheck:
      disable: true  # healthcheck image memeriksa HTTP :8000, pekerja tidak melayani HTTP
    depends_on:
      # Bukan service_healthy: kalau api gagal memuat peta aktif, pekerja tetap harus bisa membangun
      # peta pengganti. Kalau migrasi belum selesai, pekerja gagal lalu diulang oleh restart.
      api:
        condition: service_started
    restart: unless-stopped

  tusd:
    # Server tus resmi (MIT). Entrypoint image menjalankan "exec tusd $@", jadi command = flag tusd.
    image: tusproject/tusd:v2.10.1
    command:
      - -upload-dir=/data/uploads
      - -base-path=/files/
      - -behind-proxy
      - -disable-download  # video tidak bisa diambil kembali lewat Tunnel (ketentuan Cloudflare)
      - -disable-termination  # klien tidak bisa menghapus unggahan; pembersihan oleh pekerja
      - -max-size=2147483648  # 2 GiB, sama dengan MAX_VIDEO_BYTES di server/uploads.py
      - -hooks-http=http://api:8000/internal/tus-hook?key=${TUS_HOOK_SECRET:?isi TUS_HOOK_SECRET di deploy/.env}
      - -hooks-enabled-events=pre-create,pre-finish
    volumes:
      # Hanya folder unggahan: tusd nanti menghadap internet lewat Tunnel, jangan lihat jobs/ dan inbox/.
      - type: bind
        source: ${EUTOPOS_DATA_DIR:?isi EUTOPOS_DATA_DIR di deploy/.env}/uploads
        target: /data/uploads
        bind:
          create_host_path: false
    # Sengaja tanpa "ports": diakses lewat cloudflared (PR 4) atau dari container lain.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  cache:
