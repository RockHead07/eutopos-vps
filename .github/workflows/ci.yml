name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default token has no permissions. Each job requests the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --locked: fail if uv.lock is out of sync with pyproject.toml, so CI runs the exact tool
      # versions used locally.
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked ruff format --check .

  # Unit tests run inside the image the PC lab runs (Dockerfile target "test"). The same build also
  # proves the Dockerfile and the dashboard (Next.js stage) still build. CPU torch, nothing is pushed.
  tests:
    name: Tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: test
          push: false
          # Layer cache (torch, hloc, npm) in the GitHub Actions cache. A miss only costs time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  workflows:
    name: Workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --locked zizmor --format=github .github/
        env:
          # Read-only token so online audits (e.g. actions with known vulnerabilities) also run.
          GH_TOKEN: ${{ github.token }}
